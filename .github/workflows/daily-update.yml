name: Daily recommendations update

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 06:00/07:00 Berlin je nach Sommerzeit
  workflow_dispatch: {}    # manuell auslösbar im Actions-Tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch recommendations
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-recommendations.mjs

      - name: Commit updated data
        run: |
          git config user.name "streamguide-bot"
          git config user.email "actions@github.com"
          git add recommendations.json
          git diff --quiet --cached || git commit -m "Tägliches Daten-Update"
          git push
