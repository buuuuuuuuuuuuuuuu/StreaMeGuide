name: TV-Quellen testen (temporär)
on:
  push:
    branches: [probe/tv-quellen]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-tv.mjs
        env:
          DRY_RUN: "1"
