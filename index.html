<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StreaMeGuide</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F0FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script>
  // Läuft vor dem ersten Rendern: sonst blitzt beim Start kurz das helle
  // Layout auf, bevor app.js geladen ist.
  (function () {
    try {
      var stored = localStorage.getItem("streamguide:theme");
      var dark = stored ? stored === "dark"
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", dark ? "#16111F" : "#F4F0FF");
    } catch (e) {}
  })();
</script>
</head>
<body>
<main id="app">

  <header class="topbar">
    <div class="brand"><span class="blob" aria-hidden="true"></span> StreaMeGuide</div>
    <button class="icon-btn" id="theme-btn" aria-label="Hell/Dunkel umschalten">🌙</button>
  </header>

  <section class="panel" id="onboarding-panel">
    <button class="panel-toggle" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">
      <span class="panel-toggle-text">
        <span class="panel-title" id="panel-title">Profile &amp; Einstellungen</span>
        <span class="panel-sub" id="panel-sub"></span>
      </span>
      <span class="panel-chevron" aria-hidden="true">▾</span>
    </button>

    <nav class="segmented profile-switch" id="profile-switch" aria-label="Profil wählen"></nav>

    <div class="filter-row">
      <span class="filter-label">Filter</span>
      <div class="segmented segmented-sm" id="strictness-row"></div>
    </div>

    <div class="panel-status" id="generated-at">lädt…</div>

    <div id="panel-body">
      <p class="panel-hint">Geschmacksprofil im LLM-Chat ermitteln, fertige
        Datei hier hochladen. Für bis zu zwei Personen.</p>

      <div class="btn-row">
        <button class="btn bubble small" id="copy-prompt">Prompt kopieren</button>
        <button class="btn secondary small" id="sync-btn">Geräte-Sync</button>
      </div>

      <div class="btn-row">
        <label class="btn small" for="file-A">Profil A laden</label>
        <input type="file" id="file-A" accept="application/json">
        <label class="btn small" for="file-B">Profil B laden</label>
        <input type="file" id="file-B" accept="application/json">
        <button class="btn secondary small" id="export-A">A sichern</button>
        <button class="btn secondary small" id="export-B">B sichern</button>
      </div>

      <div class="status-row">
        <span class="status-pill" id="status-A">Profil A: leer</span>
        <span class="status-pill" id="status-B">Profil B: leer</span>
        <span class="status-pill" id="sync-status">Sync: aus</span>
      </div>
    </div>
  </section>

  <button class="btn mint small refine-open" id="refine-btn">Profil verfeinern</button>

  <div id="hero"></div>
  <div id="list"></div>

  <footer>StreaMeGuide <span id="footer-version">v…</span> · TMDb &amp; MediathekViewWeb</footer>
</main>

<div id="update-banner" class="update-banner">
  <span>✨ Neue Version da</span>
  <button id="update-reload" class="btn small">Jetzt laden</button>
</div>

<div id="modal-overlay" class="overlay">
  <div class="modal">
    <div id="modal-content"></div>
  </div>
</div>

<div id="refine-view" class="overlay full">
  <div class="refine-panel">
    <div class="refine-header">
      <h3 id="refine-title">Profil verfeinern</h3>
      <button class="btn secondary small" id="refine-close">Fertig</button>
    </div>
    <div id="refine-body"></div>
  </div>
</div>

<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
